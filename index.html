<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Grade 2 Demo: Bootstrap + GSAP Scroll</title>

    <!-- Bootstrap CSS -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <!-- typography -->

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400..800;1,400..800&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Outfit:wght@100..900&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;1,100;1,200;1,300;1,400;1,500;1,600;1,700&display=swap"
      rel="stylesheet"
    />
    <!-- Custom Styles -->
    <link rel="stylesheet" href="./assets/css/index.css" />
    <!-- Custom Scripts -->
    <script src="./assets/js/main.js" defer></script>
  </head>

  <body data-bs-spy="scroll" data-bs-target="#navbar" data-bs-offset="100">
    <!-- Navigation -->
    <nav id="navbar" class="navbar navbar-expand-lg fixed-top">
      <div class="container">
        <div class="row w-100 align-items-center">
          <!-- PORTFOLIO NAME -->
          <div class="col-2">
            <a class="navbar-brand" href="#">Portfolio</a>
          </div>

          <!-- EMPTY SPACE LEFT -->
          <div class="col-4"></div>

          <!-- ABOUT BUTTON -->
          <div class="col-2 text-end">
            <a class="nav-link d-inline-block" href="#about">About</a>
          </div>

          <!-- WORKS BUTTON -->
          <div class="col-2 text-end">
            <a class="nav-link d-inline-block" href="#works">Works</a>
          </div>

          <!-- CONTACT BUTTON -->
          <div class="col-2 text-end">
            <a class="nav-link d-inline-block" href="#contact">Contact</a>
          </div>
        </div>
      </div>
    </nav>

    <main>
      <!-- Hero Section -->
      <section
        id="hero"
        class="hero min-vh-100 d-flex align-items-center position-relative overflow-hidden"
      >
        <!-- Parallax Background -->
        <div class="hero-bg position-absolute w-100 h-100"></div>

        <div
          class="container position-relative z-1 text-center text-white"
        ></div>

        <!-- Scroll indicator -->
        <div
          class="scroll-indicator position-absolute bottom-0 start-50 translate-middle-x mb-4"
        >
          <div class="mouse"></div>
        </div>
      </section>

      <!-- About Section -->
      <section id="about" class="py-5 py-lg-6"></section>

      <!-- Projects Section -->
      <section id="projects" class="py-5 py-lg-6"></section>

      <!-- Contact Section -->
      <section id="contact" class="py-5 py-lg-6"></section>
    </main>

    <!-- Footer -->
    <footer class="py-4 text-center text-muted small">
      <div class="container">
        <p class="mb-0">
          &copy; 2025 John Designer. Built with Bootstrap 5 + GSAP.
        </p>
      </div>
    </footer>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

    <!-- GSAP + Plugins -->
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.12/dist/gsap.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.12/dist/ScrollTrigger.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.12/dist/ScrollToPlugin.min.js"></script>
  </body>
</html>
