<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Grade 2 Demo: Bootstrap + GSAP Scroll</title>

    <!-- Bootstrap CSS -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />

    <!-- Custom Styles -->
    <link rel="stylesheet" href="./assets/css/index.css" />
    <!-- Custom Scripts -->
    <script src="./assets/js/main.js" defer></script>
  </head>

  <body data-bs-spy="scroll" data-bs-target="#navbar" data-bs-offset="100">
    <!-- Navigation -->
    <nav id="navbar" class="navbar navbar-expand-lg fixed-top">
      <div class="container-fluid">
        <div class="row w-100 gx-0 align-items-center">
          <!-- PORTFOLIO NAME -->
          <div class="col-2">
            <a class="navbar-brand" href="#">Portfolio</a>
          </div>

          <!-- EMPTY SPACE LEFT -->
          <div class="col-4"></div>

          <!-- ABOUT BUTTON -->
          <div class="col-2 text-end">
            <a class="nav-link d-inline-block" href="#about">About</a>
          </div>

          <!-- WORKS BUTTON -->
          <div class="col-2 text-end">
            <a class="nav-link d-inline-block" href="#works">Works</a>
          </div>

          <!-- CONTACT BUTTON -->
          <div class="col-2 text-end">
            <a class="nav-link d-inline-block" href="#contact">Contact</a>
          </div>
        </div>
      </div>
    </nav>

    <main>
      <!-- Hero Section -->
      <section
        id="hero"
        class="hero min-vh-100 align-items-center position-relative overflow-hidden"
      >
        <div class="container-fluid">
          <div class="row">
            <div class="col-8 offset-2">
              <div
                id="carouselExampleSlidesOnly"
                class="carousel slide carousel-fade"
                data-bs-ride="carousel"
                data-bs-interval="4000"
                data-bs-pause="false"
              >
                <div class="carousel-inner">
                  <div class="carousel-item active">
                    <img
                      class="hero-img w-100"
                      src="./assets/images/img1.jpeg"
                      alt="Hero image 1"
                    />
                  </div>

                  <div class="carousel-item">
                    <img
                      class="hero-img w-100"
                      src="./assets/images/img2.jpeg"
                      alt="Hero image 2"
                    />
                  </div>

                  <div class="carousel-item">
                    <img
                      class="hero-img w-100"
                      src="./assets/images/img3.jpeg"
                      alt="Hero image 3"
                    />
                  </div>
                </div>
              </div>
            </div>
          </div>
        </div>
      </section>

      <!-- About Section -->
      <section id="about" class="py-5 py-lg-6"></section>

      <!-- Projects Section -->
      <section id="projects" class="py-5 py-lg-6"></section>

      <!-- Contact Section -->
      <section id="contact" class="py-5 py-lg-6"></section>
    </main>

    <!-- Footer -->
    <footer class="py-4 text-center text-muted small">
      <div class="container">
        <p class="mb-0">
          &copy; 2025 John Designer. Built with Bootstrap 5 + GSAP.
        </p>
      </div>
    </footer>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

    <!-- GSAP + Plugins -->
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.12/dist/gsap.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.12/dist/ScrollTrigger.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.12/dist/ScrollToPlugin.min.js"></script>
  </body>
</html>
